{% extends "layouts/app.html" %}
{% block content %}
<div class="p-6">

    <h2 class="text-2xl font-bold mb-4">Edit Income Source</h2>

    <form method="POST"
          action="{{ url_for('income_sources_update_or_delete', id=source.source_id) }}">
        <input type="hidden" name="_method" value="PUT">

        <div>
            <label class="block mb-2">Source Name</label>
            <input type="text" name="source_name"
                   value="{{ source.source_name }}"
                   class="border p-2 block w-full">
            {% if errors.get('source_name') %}
            <ul class="text-sm text-red-600 mt-1"><li>{{ errors['source_name'] }}</li></ul>
            {% endif %}
        </div>

        <div class="mt-4">
            <label class="block mb-2">Amount</label>
            <input type="number" step="0.01" name="amount"
                   value="{{ source.amount }}"
                   class="border rounded p-2 w-full" required>
            {% if errors.get('amount') %}
            <ul class="text-sm text-red-600 mt-1"><li>{{ errors['amount'] }}</li></ul>
            {% endif %}
        </div>

        <button type="submit"
                class="bg-blue-500 text-white px-4 py-2 mt-4 rounded">
            Update
        </button>

    </form>

</div>
{% endblock %}
