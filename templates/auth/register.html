{% extends "layouts/guest.html" %}
{% block content %}

<form method="POST" action="{{ url_for('auth_register') }}">

    <div>
        <label for="name" class="block font-medium text-sm text-gray-700">Name</label>
        <input id="name" class="border-gray-300 focus:border-indigo-500 focus:ring-indigo-500 rounded-md shadow-sm block mt-1 w-full"
               type="text" name="name" value="{{ old.get('name', '') }}" required autofocus autocomplete="name" />
        {% if errors.get('name') %}
        <ul class="text-sm text-red-600 space-y-1 mt-2"><li>{{ errors['name'] }}</li></ul>
        {% endif %}
    </div>

    <div class="mt-4">
        <label for="email" class="block font-medium text-sm text-gray-700">Email</label>
        <input id="email" class="border-gray-300 focus:border-indigo-500 focus:ring-indigo-500 rounded-md shadow-sm block mt-1 w-full"
               type="email" name="email" value="{{ old.get('email', '') }}" required autocomplete="username" />
        {% if errors.get('email') %}
        <ul class="text-sm text-red-600 space-y-1 mt-2"><li>{{ errors['email'] }}</li></ul>
        {% endif %}
    </div>

    <div class="mt-4">
        <label for="password" class="block font-medium text-sm text-gray-700">Password</label>
        <input id="password" class="border-gray-300 focus:border-indigo-500 focus:ring-indigo-500 rounded-md shadow-sm block mt-1 w-full"
               type="password" name="password" required autocomplete="new-password" />
        {% if errors.get('password') %}
        <ul class="text-sm text-red-600 space-y-1 mt-2"><li>{{ errors['password'] }}</li></ul>
        {% endif %}
    </div>

    <div class="mt-4">
        <label for="password_confirmation" class="block font-medium text-sm text-gray-700">Confirm Password</label>
        <input id="password_confirmation" class="border-gray-300 focus:border-indigo-500 focus:ring-indigo-500 rounded-md shadow-sm block mt-1 w-full"
               type="password" name="password_confirmation" required autocomplete="new-password" />
    </div>

    <div class="flex items-center justify-end mt-4">
        <a class="underline text-sm text-gray-600 hover:text-gray-900 rounded-md focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
           href="{{ url_for('auth_login') }}">
            Already registered?
        </a>
        <button type="submit" class="inline-flex items-center px-4 py-2 bg-gray-800 border border-transparent rounded-md font-semibold text-xs text-white uppercase tracking-widest hover:bg-gray-700 focus:bg-gray-700 active:bg-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition ease-in-out duration-150 ms-4">
            Register
        </button>
    </div>
</form>
{% endblock %}
