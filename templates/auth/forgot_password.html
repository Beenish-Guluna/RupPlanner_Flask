{% extends "layouts/guest.html" %}
{% block content %}

<div class="mb-4 text-sm text-gray-600">
    Forgot your password? No problem. Enter your email address and we will send you a password reset link.
</div>

{% if status %}
<div class="mb-4 font-medium text-sm text-green-600">{{ status }}</div>
{% endif %}

<form method="POST" action="{{ url_for('auth_forgot_password') }}">

    <div>
        <label for="email" class="block font-medium text-sm text-gray-700">Email</label>
        <input id="email" class="border-gray-300 focus:border-indigo-500 focus:ring-indigo-500 rounded-md shadow-sm block mt-1 w-full"
               type="email" name="email" required autofocus />
        {% if errors.get('email') %}
        <ul class="text-sm text-red-600 space-y-1 mt-2"><li>{{ errors['email'] }}</li></ul>
        {% endif %}
    </div>

    <div class="flex items-center justify-end mt-4">
        <button type="submit" class="inline-flex items-center px-4 py-2 bg-gray-800 border border-transparent rounded-md font-semibold text-xs text-white uppercase tracking-widest hover:bg-gray-700 focus:bg-gray-700 active:bg-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition ease-in-out duration-150">
            Email Password Reset Link
        </button>
    </div>
</form>

<div class="mt-4 text-center text-sm text-gray-600">
    <a href="{{ url_for('auth_login') }}" class="underline hover:text-gray-900">Back to login</a>
</div>
{% endblock %}
